
name: AWS DevSecOps Pipeline

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ousl-project

    steps:

      # --------------------------------
      # 1. Checkout Source Code
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # 2. Setup Java 17
      # --------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------
      # 3. SonarCloud SAST Scan
      # --------------------------------
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=ousl-student-service || true

      # --------------------------------
      # 4. Verify JAR File
      # --------------------------------
      - name: Verify JAR File
        run: |
          echo "Checking generated JAR files..."
          ls -lh target/*.jar

      # --------------------------------
      # 5. Build Docker Image
      # --------------------------------
      - name: Build Container
        run: |
          docker build -t lab-test-api:${{ github.sha }} .

      # --------------------------------
      # 6. Trivy Security Scan
      # --------------------------------
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'lab-test-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'

      # --------------------------------
      # 7. Configure AWS Credentials
      # --------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # --------------------------------
      # 8. Login to Amazon ECR
      # --------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------
      # 9. Push Container Image to ECR
      # --------------------------------
      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag lab-test-api:${{ github.sha }} \
            $ECR_REGISTRY/lab-test-api:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/lab-test-api:${{ github.sha }}

      # ================================================
      # 10. AUTOMATIC DEPLOYMENT TO AWS EC2 USING SSM
      # ================================================
      - name: Deploy to AWS EC2 using SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DB_PASS: ${{ secrets.DB_PASS }}

        run: |

          set -e

          echo "=================================="
          echo "Starting AWS EC2 Deployment"
          echo "=================================="

          # Validate required variables
          if [ -z "$DB_PASS" ]; then
            echo "ERROR: DB_PASS GitHub Secret is missing!"
            exit 1
          fi

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "ERROR: EC2_INSTANCE_ID is missing!"
            exit 1
          fi

          # --------------------------------
          # Prepare Remote Deployment Script
          # --------------------------------

          REMOTE_SCRIPT=$(cat <<'EOF'
          set -e

          echo "Starting Docker service..."
          systemctl start docker

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region "__AWS_REGION__" | \
            docker login \
            --username AWS \
            --password-stdin "__ECR_REGISTRY__"

          echo "Pulling Docker image..."

          docker pull "__ECR_REGISTRY__/lab-test-api:__IMAGE_TAG__"

          # --------------------------------
          # Ensure Docker Network Exists
          # --------------------------------

          echo "Checking Docker network..."

          if ! docker network inspect book-network >/dev/null 2>&1; then
              echo "Creating book-network..."
              docker network create book-network
          else
              echo "book-network already exists."
          fi

          # --------------------------------
          # Stop Existing Application
          # --------------------------------

          echo "Stopping old application container..."

          docker stop lab-test-api || true
          docker rm lab-test-api || true

          # --------------------------------
          # Check Port 8080
          # --------------------------------

          echo "Checking containers using port 8080..."

          CONTAINER_IDS=$(docker ps -q --filter "publish=8080")

          if [ -n "$CONTAINER_IDS" ]; then
              echo "Stopping containers occupying port 8080..."
              docker stop $CONTAINER_IDS
              docker rm $CONTAINER_IDS
          fi

          # --------------------------------
          # Deploy New Application Container
          # --------------------------------

          echo "Starting new application container..."

          docker run -d \
            --name lab-test-api \
            --network book-network \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_HOST=book-postgres \
            -e DB_USER=postgres \
            -e DB_PASS='__DB_PASS__' \
            "__ECR_REGISTRY__/lab-test-api:__IMAGE_TAG__"

          # --------------------------------
          # Verify Deployment
          # --------------------------------

          echo "Waiting for application startup..."

          sleep 10

          if [ "$(docker inspect -f '{{.State.Running}}' lab-test-api)" != "true" ]; then
              echo "ERROR: Application container is not running!"
              docker logs --tail 50 lab-test-api
              exit 1
          fi

          echo "Checking application logs..."

          docker logs --tail 30 lab-test-api

          echo "Checking Docker network..."

          docker network inspect book-network

          echo "=================================="
          echo "Deployment completed successfully!"
          echo "=================================="

          EOF
          )

          # --------------------------------
          # Inject Deployment Variables Safely
          # --------------------------------

          export REMOTE_SCRIPT

          REMOTE_SCRIPT=$(python3 - <<'PY'
          import os

          script = os.environ["REMOTE_SCRIPT"]

          replacements = {
              "__AWS_REGION__": os.environ["AWS_REGION"],
              "__ECR_REGISTRY__": os.environ["ECR_REGISTRY"],
              "__IMAGE_TAG__": os.environ["IMAGE_TAG"],
              "__DB_PASS__": os.environ["DB_PASS"],
          }

          for key, value in replacements.items():
              if any(c in value for c in ("\n", "\r", "\x00")):
                  raise SystemExit("Invalid deployment variable")

              script = script.replace(key, value.replace("'", "'\\''"))

          print(script)
          PY
          )

          # --------------------------------
          # Convert Deployment Script to JSON
          # --------------------------------

          PARAMS=$(jq -n \
            --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          # --------------------------------
          # Send Command Through AWS SSM
          # --------------------------------

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Automatic Deployment" \
            --parameters "$PARAMS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 deployment..."

          # --------------------------------
          # Wait for Deployment Completion
          # --------------------------------

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "=================================="
              echo "EC2 DEPLOYMENT SUCCESSFUL!"
              echo "=================================="

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "EC2 deployment failed!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --output json

              exit 1

            fi

            sleep 10

          done

          echo "Deployment timed out!"
          exit 1
