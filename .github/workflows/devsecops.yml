
name: AWS DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ousl-project

    steps:

      # --------------------------------
      # 1. Checkout Source Code
      # --------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # 2. Setup Java 17
      # --------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------
      # 3. SonarCloud SAST Scan
      # --------------------------------
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=ousl-student-service || true

      # --------------------------------
      # 4. Verify JAR File
      # --------------------------------
      - name: Verify JAR File
        run: |
          echo "Checking generated JAR files..."
          ls -lh target/*.jar

      # --------------------------------
      # 5. Build Docker Image
      # --------------------------------
      - name: Build Container
        run: |
          docker build -t lab-test-api:${{ github.sha }} .

      # --------------------------------
      # 6. Trivy Security Scan
      # --------------------------------
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'lab-test-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'

      # --------------------------------
      # 7. Configure AWS Credentials
      # --------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # --------------------------------
      # 8. Login to Amazon ECR
      # --------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------
      # 9. Push Container Image to ECR
      # --------------------------------
      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag lab-test-api:${{ github.sha }} \
            $ECR_REGISTRY/lab-test-api:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/lab-test-api:${{ github.sha }}

      # ================================================
      # 10. AUTOMATIC DEPLOYMENT TO AWS EC2 USING SSM
      # ================================================
      - name: Deploy to AWS EC2 using SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "=================================="
          echo "Starting AWS EC2 Deployment"
          echo "=================================="

          # Prepare deployment script

          REMOTE_SCRIPT=$(cat <<EOF
          set -e

          echo "Starting Docker service..."
          systemctl start docker

          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region "${AWS_REGION}" | \
            docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

          echo "Pulling Docker image..."

          docker pull "${ECR_REGISTRY}/lab-test-api:${IMAGE_TAG}"

          echo "Stopping old application container..."

          docker stop lab-test-api || true
          docker rm lab-test-api || true

          echo "Checking containers using port 8080..."

          CONTAINER_IDS=\$(docker ps -q --filter "publish=8080")

          if [ -n "\$CONTAINER_IDS" ]; then
              echo "Stopping containers occupying port 8080..."
              docker stop \$CONTAINER_IDS
              docker rm \$CONTAINER_IDS
          fi

          echo "Starting new application container..."

          docker run -d \
            --name lab-test-api \
            --restart unless-stopped \
            -p 8080:8080 \
            "${ECR_REGISTRY}/lab-test-api:${IMAGE_TAG}"

          echo "Checking deployment..."

          sleep 5

          docker ps

          echo "Checking application logs..."

          docker logs --tail 30 lab-test-api

          echo "Deployment completed successfully!"

          EOF
          )

          # Convert deployment script to JSON

          PARAMS=$(jq -n \
            --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          # Send command through AWS SSM

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Automatic Deployment" \
            --parameters "$PARAMS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 deployment..."

          # Wait for deployment completion

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "=================================="
              echo "EC2 DEPLOYMENT SUCCESSFUL!"
              echo "=================================="

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "EC2 deployment failed!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --output json

              exit 1

            fi

            sleep 10

          done

          echo "Deployment timed out!"
          exit 1
